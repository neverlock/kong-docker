x-kong-image: &kong-image kong:${KONG_CE_VERSION:-3.9.5}

x-kong-database-env: &kong-database-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: ${KONG_PG_HOST:-kong-database}
  KONG_PG_DATABASE: ${POSTGRES_DB:-kong}
  KONG_PG_USER: ${POSTGRES_USER:-kong}
  KONG_PG_PASSWORD: ${POSTGRES_PASSWORD:-kong}

services:
  kong-database:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: kong-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kong}
      POSTGRES_DB: ${POSTGRES_DB:-kong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kong}
    volumes:
      - "${POSTGRES_DATA_DIR:-./kong_ce_data}:/var/lib/postgresql/data"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  kong-bootstrap:
    image: *kong-image
    depends_on:
      kong-database:
        condition: service_healthy
    environment:
      <<: *kong-database-env
    command: kong migrations bootstrap

  kong:
    image: *kong-image
    container_name: kong
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully
    restart: always
    environment:
      <<: *kong-database-env
      TZ: ${TZ:-Asia/Bangkok}
      KONG_ADMIN_LISTEN: ${KONG_ADMIN_LISTEN:-0.0.0.0:8001}
      KONG_PROXY_LISTEN: ${KONG_PROXY_LISTEN:-0.0.0.0:8000, 0.0.0.0:8443 ssl http2}
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      KONG_ADMIN_GUI_URL: http://127.0.0.1:${KONG_MANAGER_PORT:-8002}
      KONG_ADMIN_GUI_API_URL: http://127.0.0.1:${KONG_ADMIN_PORT:-8001}
      KONG_NGINX_HTTP_RESOLVER:
      KONG_TRUSTED_IPS:
      KONG_REAL_IP_RECURSIVE:
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "${KONG_PROXY_HTTP_PORT:-80}:8000"
      - "${KONG_PROXY_HTTPS_PORT:-443}:8443"
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
      - "127.0.0.1:${KONG_MANAGER_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 15
